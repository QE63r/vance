<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1419" />
<title>梵境</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a222c;
    --line: #2a3644;
    --text: #e6edf3;
    --dim: #8b98a5;
    --accent: #3a6e7e;
    --ok: #3f7d5a;
    --danger: #b8433a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  .brand { font-weight: 600; }
  .brand small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .dot.on { background: var(--ok); }

  main { padding: 16px 14px 140px; max-width: 680px; margin: 0 auto; }
  #feed { display: flex; flex-direction: column; gap: 10px; }

  .msg {
    max-width: 88%; padding: 10px 13px; border-radius: 14px;
    font-size: 15px; white-space: pre-wrap; word-break: break-word; line-height: 1.55;
  }
  .msg.user { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 5px; }
  .msg.agent { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .msg.agent:empty { display: none; }

  .step {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 13px; color: var(--dim); padding: 2px 2px;
  }
  .step .mark { flex: 0 0 16px; text-align: center; }
  .step .mark.running { color: #5aa9c9; animation: pulse 1.2s infinite; }
  .step .mark.done { color: #63b381; }
  .step .mark.failed { color: #d0564c; }
  .step .title {
    flex: 1; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; word-break: break-word;
  }
  .step .title.trunc, .step .title.expanded { cursor: pointer; }
  .step .title.trunc::after { content: "展开"; font-family: inherit; font-size: 11px; color: var(--accent); margin-left: 6px; }
  .step .title.expanded::after { content: "收起"; font-family: inherit; font-size: 11px; color: var(--accent); margin-left: 6px; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; align-self: stretch;
  }
  .card.alert { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(184,67,58,.25); }
  .kicker { font-size: 11px; letter-spacing: .08em; color: var(--danger); text-transform: uppercase; }
  .action {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 14px; line-height: 1.6; margin: 8px 0 10px;
    background: #11181f; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); word-break: break-all; white-space: pre-wrap;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--dim); }
  .meta .tag { display: inline-flex; gap: 5px; background: #141c24; border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px; }
  .meta b { color: var(--text); font-weight: 500; }

  /* 编辑类的 diff：绿加红删，来自 Agent 自己的 rawInput */
  .diff {
    margin: 8px 0 2px; background: #11181f; border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; max-height: 220px; overflow: auto;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; line-height: 1.5;
  }
  .diff .line { white-space: pre-wrap; word-break: break-all; color: #8b98a5; }
  .diff .add { color: #7ec699; background: rgba(126,198,153,.08); }
  .diff .del { color: #e07b72; background: rgba(224,123,114,.08); }
  .diff .hunk { color: #5d6a77; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 11px;
    padding: 14px 10px; color: #fff; cursor: pointer; transition: opacity .15s;
  }
  button:disabled { opacity: .45; cursor: default; }
  .deny { background: var(--danger); }
  .allow { background: var(--ok); }
  .remember {
    display: block; width: 100%; margin-top: 8px; padding: 10px;
    background: transparent; border: 1px solid var(--line);
    color: var(--dim); font-size: 13px; font-weight: 500;
  }
  .notice { align-self: center; font-size: 12px; color: var(--dim); padding: 2px 0; }
  .notice.deny { color: #d0564c; }
  .verdict { margin-top: 10px; font-size: 13px; color: var(--dim); text-align: center; }
  details { margin-top: 10px; font-size: 12px; color: var(--dim); }
  details summary { cursor: pointer; list-style: none; padding: 3px 0; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .detail-row { margin-top: 4px; font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; color: #74818d; }

  .divider { display: flex; align-items: center; gap: 10px; color: #4c5a67; font-size: 11px; margin: 6px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    background: linear-gradient(to top, var(--bg) 74%, rgba(15,20,25,0));
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .composer .row {
    display: flex; gap: 8px; align-items: flex-end; max-width: 680px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 7px;
  }
  .composer textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent;
    color: var(--text); font: inherit; font-size: 15px; line-height: 1.4;
    max-height: 110px; padding: 8px 6px;
  }
  .composer textarea::placeholder { color: #5d6a77; }
  .composer button { flex: 0 0 auto; padding: 10px 15px; border-radius: 10px; font-size: 14px; }
  .send { background: var(--accent); }
  .stop { background: var(--danger); }
  .hint { max-width: 680px; margin: 6px auto 0; font-size: 11px; color: #55636f; text-align: center; }

  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<header>
  <div class="brand">梵境 <small id="project">—</small></div>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">连接中…</span></div>
</header>

<main>
  <div id="feed"></div>
</main>

<div class="composer">
  <div class="row">
    <textarea id="input" rows="1" placeholder="在这里跟你电脑上的 Agent 说话…"></textarea>
    <button class="send" id="send">发送</button>
    <button class="stop" id="stop" hidden>停止</button>
  </div>
  <div class="hint" id="hint">空闲</div>
</div>

<script>
(() => {
  const token = new URLSearchParams(location.search).get("token") || "";
  const feed = document.getElementById("feed");
  const projectEl = document.getElementById("project");
  const connEl = document.getElementById("conn");
  const dotEl = document.getElementById("dot");

  const MARK = { pending: "○", running: "●", done: "✓", failed: "✗" };
  const KIND = { execute: "执行", edit: "编辑", read: "读取", fetch: "联网", other: "访问" };
  const STEP_MAX = 52;

  const stepEls = new Map();
  const bubbles = new Map();
  let ws = null, retry = 800, running = false, stickBottom = true, sawTask = false, ackTimer = null;

  /* ── 滚动：贴底时自动跟随，用户翻上去就不打扰 ── */
  window.addEventListener("scroll", () => {
    stickBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 140;
  }, { passive: true });

  function toBottom(force) {
    if (!force && !stickBottom) return;
    requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight }));
  }

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    if (text !== undefined) el.textContent = text;
    feed.appendChild(el);
    toBottom();
    return el;
  }

  /* ── 三条渲染路径：我说的话、它说的话、它做的步骤 ── */

  function showUser(text) {
    add("msg user", text);
    toBottom(true);
  }

  function showAgent(msgId, chunk) {
    let b = bubbles.get(msgId);
    if (!b) { b = add("msg agent"); bubbles.set(msgId, b); }
    b.textContent += chunk;
    toBottom();
  }

  function showStep(step) {
    let row = stepEls.get(step.id);
    if (!row) {
      row = document.createElement("div");
      row.className = "step";
      row.innerHTML = `<span class="mark"></span><span class="title"></span>`;
      feed.appendChild(row);
      stepEls.set(step.id, row);
    }
    const prefix = step.kind && step.kind !== "execute" ? (KIND[step.kind] || step.kind) + " · " : "";
    const full = prefix + (step.title || "");

    row.querySelector(".mark").className = "mark " + step.status;
    row.querySelector(".mark").textContent = MARK[step.status] || "○";

    const title = row.querySelector(".title");
    title.className = "title";
    if (full.length > STEP_MAX) {
      title.textContent = full.slice(0, STEP_MAX).trimEnd() + "…";
      title.classList.add("trunc");
      title.onclick = () => {
        const ex = title.classList.contains("expanded");
        title.classList.toggle("expanded", !ex);
        title.classList.toggle("trunc", ex);
        title.textContent = ex ? full.slice(0, STEP_MAX).trimEnd() + "…" : full;
      };
    } else {
      title.textContent = full;
    }
    toBottom();
  }

  /* ── 审批卡片：作为对话里的一条，插在最下面 ── */

  function showApproval(ev) {
    if (feed.querySelector(`.card[data-id="${CSS.escape(ev.request_id)}"]`)) return;

    const card = document.createElement("div");
    card.className = "card alert";
    card.dataset.id = ev.request_id;

    const kicker = document.createElement("div");
    kicker.className = "kicker";
    kicker.textContent = "需要你批准";

    const action = document.createElement("div");
    action.className = "action";
    action.textContent = ev.action_display || "(无动作)";

    const meta = document.createElement("div");
    meta.className = "meta";
    const facts = ev.facts || {};
    const tag = (label, value) => {
      if (value === undefined || value === null || value === "" || value === "-") return;
      const s = document.createElement("span");
      s.className = "tag";
      s.append(label + " ");
      const b = document.createElement("b");
      b.textContent = String(value);
      s.append(b);
      meta.append(s);
    };
    tag("类型", KIND[facts.kind] || facts.kind);
    tag("位置", facts.locations === facts.files ? "" : facts.locations);
    tag("文件", facts.files);
    if (typeof facts.adds === "number" || typeof facts.removes === "number") {
      tag("改动", `+${facts.adds ?? 0} −${facts.removes ?? 0}`);
    }

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.innerHTML = `<button class="deny">拒绝</button><button class="allow">批准</button>`;

    const memorize = document.createElement("button");
    memorize.className = "remember";
    memorize.textContent = "记住这个选择（下次不再问）";

    const verdict = document.createElement("div");
    verdict.className = "verdict";

    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "详情（校验信息）";
    const rowEl = document.createElement("div");
    rowEl.className = "detail-row";
    rowEl.textContent = `原文 ${ev.raw_ref ? ev.raw_ref.length : 0} 字节 · 摘要 ${(ev.raw_digest || "").slice(0, 16)}…`;
    details.append(summary, rowEl);

    card.append(kicker, action);

    if (ev.preview) {
      const box = document.createElement("div");
      box.className = "diff";
      for (const line of String(ev.preview).split("\n").slice(0, 80)) {
        const d = document.createElement("div");
        d.className =
          "line " +
          (line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : line.startsWith("@@") ? "hunk" : "");
        d.textContent = line || " ";
        box.append(d);
      }
      card.append(box);
    }

    card.append(meta, actions, memorize, verdict, details);
    feed.appendChild(card);

    const left = Math.max(0, Math.round((ev.expires_at - Date.now()) / 1000));
    verdict.textContent = `${left} 秒内不处理将自动失效`;

    const [deny, allow] = actions.querySelectorAll("button");
    const decide = (d) => {
      deny.disabled = allow.disabled = true;
      memorize.disabled = true;
      verdict.textContent =
        d === "allow" ? "已批准，等待 Agent 确认…"
          : d === "remember" ? "已批准，以后同类操作不再问你…"
            : "已拒绝，等待 Agent 确认…";
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "decision", requestId: ev.request_id, decision: d }));
      } else {
        verdict.textContent = "没连上，决定没发出去";
        return;
      }
      if (navigator.vibrate) navigator.vibrate(30);

      // 服务端 5 秒内没确认，就说明这一下没送到，别让人以为批了
      ackTimer = setTimeout(() => {
        if (!card.classList.contains("acked")) {
          verdict.textContent = "服务端没有确认，可能没收到，请再点一次";
        }
      }, 5000);
    };
    deny.onclick = () => decide("reject");
    allow.onclick = () => decide("allow");
    memorize.onclick = () => decide("remember");

    const tick = setInterval(() => {
      const s = Math.max(0, Math.round((ev.expires_at - Date.now()) / 1000));
      if (s <= 0) {
        clearInterval(tick);
        if (!deny.disabled) {
          deny.disabled = allow.disabled = true;
          verdict.textContent = "已超时，本次批准作废";
          card.classList.remove("alert");
          setTimeout(() => fade(card, 5000), 100);
        }
      } else if (!deny.disabled) {
        verdict.textContent = `${s} 秒内不处理将自动失效`;
      }
    }, 1000);

    // 滚到屏幕中间：卡片底部容易被输入框盖住，按钮就点不到了
    requestAnimationFrame(() => card.scrollIntoView({ block: "center", behavior: "smooth" }));
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  }

  function fade(el, delay) {
    setTimeout(() => {
      el.style.transition = "opacity .5s";
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 520);
    }, delay);
  }

  function onAck(msg) {
    const card = feed.querySelector(`.card[data-id="${CSS.escape(msg.requestId)}"]`);
    if (!card) return;
    card.classList.add("acked");
    if (ackTimer) { clearTimeout(ackTimer); ackTimer = null; }
    const verdict = card.querySelector(".verdict");
    if (msg.accepted) {
      card.classList.remove("alert");
      verdict.textContent = verdict.textContent.replace("等待 Agent 确认…", "已生效");
    } else {
      verdict.textContent = "这条请求已失效";
    }
    fade(card, 7000);
  }

  /* ── 连接 ── */
  function setConn(on, text) {
    dotEl.classList.toggle("on", on);
    connEl.textContent = text;
    // 断线时把发按钮禁用、输入框改提示——否则点了没反应，像坏了
    const s = document.getElementById("send");
    const i = document.getElementById("input");
    if (s) s.disabled = !on;
    if (i) i.placeholder = on ? "在这里跟你电脑上的 Agent 说话…" : "还没连上，正在重试…";
  }

  function connect() {
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return; // 已经在连/已连上

    const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws = socket;

    // 连接超时：卡在 CONNECTING 的 socket 会挡住后面所有重连，必须主动掐掉
    const connectTimeout = setTimeout(() => {
      if (socket.readyState !== 1) {
        try { socket.close(); } catch {}
      }
    }, 8000);

    socket.onopen = () => {
      clearTimeout(connectTimeout);
      if (ws !== socket) return; // 迟到的旧连接，忽略
      retry = 800;
      setConn(true, "已连接");
    };

    socket.onclose = (ev) => {
      clearTimeout(connectTimeout);
      if (ws !== socket) return; // 旧连接关闭，不碰新连接的状态
      ws = null;

      // 4001 = 服务端说口令不对。这时候重连一万次也没用，必须让人换地址。
      if (ev && ev.code === 4001) {
        setConn(false, "口令无效");
        const hint = document.getElementById("hint");
        if (hint) hint.textContent = "地址里的口令已失效，请用电脑终端里打印的新地址打开";
        const s = document.getElementById("send");
        if (s) s.disabled = true;
        add("notice deny", "口令不对：请回到电脑终端，复制新打印的完整地址重新打开");
        return;
      }

      setConn(false, "已断开，重连中…");
      setTimeout(connect, (retry = Math.min(retry * 1.6, 8000)));
    };

    socket.onerror = () => {};

    socket.onmessage = (e) => {
      if (ws !== socket) return;
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      dispatch(msg);
    };
  }

  /** 一条消息怎么处理——实时收到和历史补发走同一条路 */
  function dispatch(msg) {
    {
      switch (msg.type) {
        case "history":
          feed.innerHTML = "";
          stepEls.clear();
          bubbles.clear();
          for (const item of msg.items || []) dispatch(item);
          toBottom(true);
          break;
        case "hello":
          projectEl.textContent = msg.project || "";
          // 只有第一次才把任务当消息显示，重连不重复
          if (msg.task && !sawTask) {
            sawTask = true;
            showUser(msg.task);
          }
          break;
        case "chat": showAgent(msg.messageId || "msg", msg.text || ""); break;
        case "event":
          if (msg.event?.type === "status_update" && msg.event.step) showStep(msg.event.step);
          if (msg.event?.type === "approval_request") showApproval(msg.event);
          break;
        case "ack": onAck(msg); break;
        case "notice": {
          const n = add("notice " + (msg.level === "deny" ? "deny" : ""), msg.text || "");
          n.classList.add("notice");
          break;
        }
        case "turn":
          setRunning(msg.state === "running", msg.state);
          if (msg.state !== "running") {
            // 这一轮结束了，用服务端的权威历史重建一次：
            // 流式渲染可能漏字（比如这次只显示了"已创建：`"），对账能修回来
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resync" }));
          }
          break;
      }
    };
  }

  /* ── 底部输入 ── */
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const stopBtn = document.getElementById("stop");
  const hintEl = document.getElementById("hint");

  function setRunning(on, state) {
    running = on;
    sendBtn.hidden = on;
    stopBtn.hidden = !on;
    hintEl.textContent = on ? "正在执行…" : state === "stopped" ? "已停止" : "空闲，可以继续说";
  }

  function sendPrompt() {
    const text = inputEl.value.trim();
    if (!text) return;
    if (running) {
      // 不静默吞掉：告诉人为什么没发出去
      hintEl.textContent = "上一轮还没结束，等它停下来再发";
      return;
    }
    if (!ws || ws.readyState !== 1) {
      add("notice deny", "还没连上，这句话没有发出去");
      return;
    }
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "prompt", text }));
      showUser(text);
      inputEl.value = "";
      inputEl.style.height = "auto";
      setRunning(true, "running");
      stickBottom = true;
    }
  }

  sendBtn.onclick = sendPrompt;
  stopBtn.onclick = () => {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "stop" }));
  };
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + "px";
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
  });

  // 手机从后台切回来：立刻重连，不用等退避
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && (!ws || ws.readyState > 1)) {
      retry = 800;
      connect();
    }
  });

  // 点右上角状态可以手动重连
  document.querySelector("header").addEventListener("click", () => {
    if (!ws || ws.readyState > 1) {
      retry = 800;
      connect();
    }
  });

  setRunning(false, "idle");
  connect();
})();
</script>
</body>
</html>
